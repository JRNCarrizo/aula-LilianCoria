<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Aula Lilian Coria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-cuerpo" data-root="../">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../">
        <span class="brand-mark">LC</span>
        <span>
          <span class="brand-kicker">Aula</span>
          <span class="brand-name">Lilian Coria</span>
        </span>
      </a>
      <nav class="nav">
        <a href="../">Volver al aula</a>
      </nav>
    </div>
  </header>

  <main class="login-pagina">
    <section class="login-card" aria-labelledby="login-titulo">
      <span class="brand-mark login-marca">LC</span>
      <p class="sello">Panel de la docente</p>
      <h1 id="login-titulo">Iniciar sesión</h1>
      <p class="login-texto">Acá se cargan y se publican las actividades del aula.</p>
      <form id="form-login">
        <div class="campo">
          <label for="clave">Clave</label>
          <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
        </div>
        <p class="aviso aviso-mal" id="error" hidden>La clave no es correcta. Probá de nuevo.</p>
        <button class="btn btn-terra login-entrar" type="submit">Entrar al panel</button>
      </form>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="../js/admin-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/actividades.js"></script>
  <script src="../js/publicaciones-config.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/site.js"></script>
  <script>
    if (AulaAuth.haySesion()) location.replace("/admin/panel.html");
    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var ok = AulaAuth.entrar(document.getElementById("clave").value);
      document.getElementById("error").hidden = ok;
      if (ok) location.replace("/admin/panel.html");
      else document.getElementById("clave").focus();
    });
  </script>
</body>
</html>
